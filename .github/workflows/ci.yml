name: CI

on:
  push:
  pull_request:

jobs:
  # Builds zcn and runs its unit tests on all three platforms. Live audio
  # defaults on only for macOS targets (CoreAudio) — the -Dlive option gates
  # runtime device use, not compilation — and the fully static Linux binary
  # is cross-built to prove it stays dep-free.
  zcn:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: drawmeanelephant/zig-zouave@2d8510d62b517fa786279562cf8b1bdcf0c47b9f
        with:
          version: 0.17.0

      - name: Verify vendored sources still match their upstream pins
        run: bash vendor/refresh-vendor.sh --check

      - name: Unit tests
        run: zig build test --summary all

      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      - name: Smoke-test the binary
        shell: bash
        run: |
          BIN=./zig-out/bin/zcn
          [ -f "$BIN" ] || BIN="$BIN.exe"
          "$BIN" --help
          WAV=$(ls demo/evidence/*/sample-decoded-peer-1s.wav | head -1)
          "$BIN" check-wav "$WAV" --min-rms 0.05

      - name: Static musl build
        if: runner.os == 'Linux'
        run: |
          zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSafe -Dlive=false --prefix zig-out-musl
          file zig-out-musl/bin/zcn
          file zig-out-musl/bin/zcn | grep -q 'statically linked'
